<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">梯度长度5与最大变化率图解</title>
  <desc id="desc">左侧用三四五直角三角形说明梯度长度为5，右侧说明沿梯度单位方向水平移动0.1时，高度增加0.5。</desc>
  <defs>
    <style>
      :root { --bg:#ffffff; --fg:#172033; --muted:#64748b; --line:#cbd5e1; --blue:#2563eb; --orange:#ea580c; --soft:#eff6ff; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#cbd5e1; --line:#475569; --blue:#60a5fa; --orange:#fb923c; --soft:#172554; } }
      text { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; fill:var(--fg); }
      .title { font-size:30px; font-weight:600; }
      .panel { font-size:23px; font-weight:600; }
      .label { font-size:19px; }
      .small { font-size:17px; fill:var(--muted); }
      .axis { stroke:var(--line); stroke-width:3; }
      .frame { fill:none; stroke:var(--line); stroke-width:2; }
      .main { stroke:var(--blue); stroke-width:7; fill:none; }
      .rise { stroke:var(--orange); stroke-width:7; fill:none; }
      .helper { stroke:var(--line); stroke-width:4; fill:none; }
      .dot { fill:var(--orange); }
      .formula { fill:var(--soft); stroke:var(--blue); stroke-width:2; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="var(--blue)"/></marker>
    <marker id="arrow-blue-small" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--blue)"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="var(--orange)"/></marker>
  </defs>
  <rect width="1200" height="650" fill="var(--bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">梯度长度 5：方向箭头的长度，也是最大瞬时变化率</text>

  <rect x="35" y="80" width="530" height="440" rx="12" class="frame"/>
  <text x="300" y="120" text-anchor="middle" class="panel">① x、y 平面：3–4–5 确定最快方向</text>
  <line x1="100" y1="455" x2="500" y2="455" class="axis"/>
  <line x1="100" y1="455" x2="100" y2="150" class="axis"/>
  <text x="505" y="480" class="label">x</text>
  <text x="78" y="150" class="label">y</text>
  <line x1="125" y1="430" x2="405" y2="430" class="helper"/>
  <line x1="405" y1="430" x2="405" y2="205" class="helper"/>
  <line x1="125" y1="430" x2="405" y2="205" class="main" marker-end="url(#arrow-blue)"/>
  <text x="265" y="420" text-anchor="middle" class="label">x 分量 = 3</text>
  <text x="418" y="325" class="label">y 分量 = 4</text>
  <text x="236" y="294" transform="rotate(-39 236 294)" class="label">梯度长度 = √(3²+4²) = 5</text>
  <line x1="125" y1="430" x2="195" y2="374" class="main" marker-end="url(#arrow-blue-small)"/>
  <text x="130" y="345" class="small">同一朝向的单位方向 = (3/5, 4/5)</text>

  <rect x="600" y="80" width="565" height="440" rx="12" class="frame"/>
  <text x="882" y="120" text-anchor="middle" class="panel">② 沿单位方向：水平走 0.1，高度增 0.5</text>
  <line x1="660" y1="455" x2="1105" y2="455" class="axis"/>
  <line x1="660" y1="455" x2="660" y2="150" class="axis"/>
  <text x="1110" y="480" text-anchor="end" class="label">水平距离</text>
  <text x="630" y="150" class="label">z 高度</text>
  <line x1="660" y1="455" x2="1060" y2="175" class="main"/>
  <text x="868" y="280" transform="rotate(-35 868 280)" class="label">高度变化率 = 5</text>
  <line x1="660" y1="455" x2="820" y2="455" class="helper"/>
  <line x1="820" y1="455" x2="820" y2="375" class="rise" marker-end="url(#arrow-orange)"/>
  <circle cx="820" cy="375" r="9" class="dot"/>
  <text x="740" y="485" text-anchor="middle" class="label">水平移动 h = 0.1</text>
  <text x="838" y="420" class="label">高度变化 ≈ 0.5</text>

  <rect x="190" y="550" width="820" height="68" rx="12" class="formula"/>
  <text x="600" y="593" text-anchor="middle" class="panel">梯度长度 5 × 水平距离 0.1 = 瞬时高度变化 0.5</text>
</svg>
