<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>复指数的双表示与正负频率配对｜符号可视页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 08 模块 · 符号不再跳步</p><h1>复指数的双表示与正负频率配对：符号地图</h1><p>每个符号都标出角色；点击“读法”可在支持语音的浏览器中朗读。</p></section><section class="panel"><table><thead><tr><th>符号</th><th>在本模块中的角色</th><th>操作</th></tr></thead><tbody><tr><th><code>ω</code></th><td>角频率</td><td><button class="speak" data-symbol="ω">读法</button></td></tr><tr><th><code>φ</code></th><td>相位</td><td><button class="speak" data-symbol="φ">读法</button></td></tr><tr><th><code>e^{jωt}</code></th><td>正向旋转</td><td><button class="speak" data-symbol="e^{jωt}">读法</button></td></tr><tr><th><code>e^{-jωt}</code></th><td>反向旋转</td><td><button class="speak" data-symbol="e^{-jωt}">读法</button></td></tr><tr><th><code>F(-ω)=overline{F(ω)}</code></th><td>实信号对称条件</td><td><button class="speak" data-symbol="F(-ω)=overline{F(ω)}">读法</button></td></tr></tbody></table></section><section class="panel"><h2>把符号放回公式</h2><div class="formula">cosωt=(e^{jωt}+e^{-jωt})/2</div><p>请依次指出：输入对象、基/算子、坐标或输出、累加变量、归一化因子。</p></section></main><script>window.MODULE={"id": "08", "title": "复指数的双表示与正负频率配对", "formula": "cosωt=(e^{jωt}+e^{-jωt})/2"}</script><script src="../assets/app.js"></script></body></html>
