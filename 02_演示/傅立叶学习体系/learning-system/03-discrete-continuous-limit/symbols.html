<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>离散采样到连续积分的极限桥｜符号可视页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 03 模块 · 符号不再跳步</p><h1>离散采样到连续积分的极限桥：符号地图</h1><p>每个符号都标出角色；点击“读法”可在支持语音的浏览器中朗读。</p></section><section class="panel"><table><thead><tr><th>符号</th><th>在本模块中的角色</th><th>操作</th></tr></thead><tbody><tr><th><code>xᵢ</code></th><td>第 i 个采样点</td><td><button class="speak" data-symbol="xᵢ">读法</button></td></tr><tr><th><code>Δx</code></th><td>采样间隔</td><td><button class="speak" data-symbol="Δx">读法</button></td></tr><tr><th><code>Σ</code></th><td>离散累加</td><td><button class="speak" data-symbol="Σ">读法</button></td></tr><tr><th><code>dx</code></th><td>连续微元</td><td><button class="speak" data-symbol="dx">读法</button></td></tr><tr><th><code>∫</code></th><td>连续累加</td><td><button class="speak" data-symbol="∫">读法</button></td></tr></tbody></table></section><section class="panel"><h2>把符号放回公式</h2><div class="formula">Σ f(xᵢ)g(xᵢ)Δx → ∫ f(x)g(x)dx</div><p>请依次指出：输入对象、基/算子、坐标或输出、累加变量、归一化因子。</p></section></main><script>window.MODULE={"id": "03", "title": "离散采样到连续积分的极限桥", "formula": "Σ f(xᵢ)g(xᵢ)Δx → ∫ f(x)g(x)dx"}</script><script src="../assets/app.js"></script></body></html>
