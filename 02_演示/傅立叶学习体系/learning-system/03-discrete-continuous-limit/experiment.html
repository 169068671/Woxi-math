<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>离散采样到连续积分的极限桥｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 03 模块 · 动手验证</p><h1>离散采样到连续积分的极限桥</h1><p>把连续公式追溯为带网格宽度的离散求和。加密网格时同时更新采样间隔、求和范围和变量；只有这样极限才保持尺度。该程序既解释点积为何变积分，也解释离散频率和为何变频率积分。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="riemann"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>Σ f(xᵢ)g(xᵢ)Δx → ∫ f(x)g(x)dx</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "03", "title": "离散采样到连续积分的极限桥", "formula": "Σ f(xᵢ)g(xᵢ)Δx → ∫ f(x)g(x)dx"}</script><script src="../assets/app.js"></script></body></html>
