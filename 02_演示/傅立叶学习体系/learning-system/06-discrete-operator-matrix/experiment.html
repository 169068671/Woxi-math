<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>连续算子的离散矩阵化｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 06 模块 · 动手验证</p><h1>连续算子的离散矩阵化</h1><p>用矩阵把连续算子变成可见、可算的有限模型。先在网格上构造差分或累加矩阵，明确每行怎样组合邻点，再研究网格缩小时它逼近哪个连续算子。端点行必须单独处理，因为边界条件决定算子。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="difference"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>f'(tᵢ) ≈ (fᵢ₊₁-fᵢ)/h</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "06", "title": "连续算子的离散矩阵化", "formula": "f'(tᵢ) ≈ (fᵢ₊₁-fᵢ)/h"}</script><script src="../assets/app.js"></script></body></html>
