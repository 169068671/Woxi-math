<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>复内积的角色—共轭审计｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 04 模块 · 动手验证</p><h1>复内积的角色—共轭审计</h1><p>不要按左右位置死记共轭，而按运算角色判断。分析/投影必须使用满足正定性的复内积，所以对一方取共轭；综合则用坐标乘原基。不同教材可把共轭放在第一或第二槽，但整套约定必须自洽。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="conjugate"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>⟨f,g⟩ = ∫f(t)overline{g(t)}dt</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "04", "title": "复内积的角色—共轭审计", "formula": "⟨f,g⟩ = ∫f(t)overline{g(t)}dt"}</script><script src="../assets/app.js"></script></body></html>
