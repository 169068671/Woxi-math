<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>傅立叶级数的分析—综合双流程｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 10 模块 · 动手验证</p><h1>傅立叶级数的分析—综合双流程</h1><p>周期函数只在基频整数倍的离散频率上展开。分析阶段在一个周期内对每个复指数基投影并除以 T；综合阶段将全部正负谐波的坐标乘基后求和。复指数形式和三角形式只是同一坐标信息的两种包装。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="fourier_series"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>cₙ=(1/T)∫_T f(t)e^{-jnω₀t}dt；f(t)=Σcₙe^{jnω₀t}</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "10", "title": "傅立叶级数的分析—综合双流程", "formula": "cₙ=(1/T)∫_T f(t)e^{-jnω₀t}dt；f(t)=Σcₙe^{jnω₀t}"}</script><script src="../assets/app.js"></script></body></html>
