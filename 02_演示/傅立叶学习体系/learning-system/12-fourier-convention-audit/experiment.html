<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>傅立叶约定的符号与归一化审计｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 12 模块 · 动手验证</p><h1>傅立叶约定的符号与归一化审计</h1><p>比较不同傅立叶公式时，不看外形投票，而做四栏审计：频率变量是 f 还是 ω，指数核是否含 2π，正负号对应哪一槽的共轭，正逆变换常数乘积是否匹配。变量替换必须连微元一起换。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="convention"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>F(ω)=∫f(t)e^{-jωt}dt；f(t)=(1/2π)∫F(ω)e^{jωt}dω</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "12", "title": "傅立叶约定的符号与归一化审计", "formula": "F(ω)=∫f(t)e^{-jωt}dt；f(t)=(1/2π)∫F(ω)e^{jωt}dω"}</script><script src="../assets/app.js"></script></body></html>
