<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>周期拉伸构造傅立叶变换｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 11 模块 · 动手验证</p><h1>周期拉伸构造傅立叶变换</h1><p>从傅立叶级数出发，把周期 T 拉长并同时追踪三项替换：基频间隔 f₀=1/T 变成 df，离散位置 nf₀ 变成连续 f，求和变成积分。坐标尺度需把 1/T 与频谱密度一起处理，不能只把 Σ 生硬换成 ∫。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="period_limit"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>T→∞：f₀→df，nf₀→f，Σ·f₀→∫·df</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "11", "title": "周期拉伸构造傅立叶变换", "formula": "T→∞：f₀→df，nf₀→f，Σ·f₀→∫·df"}</script><script src="../assets/app.js"></script></body></html>
