<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>用特征函数代数化线性算子｜实验页</title><link rel="stylesheet" href="../assets/style.css"></head><body><nav><a href="../index.html">总目录</a><a href="experiment.html">实验</a><a href="explain.html">讲解</a><a href="symbols.html">符号</a></nav><main><section class="hero"><p class="eyebrow">第 07 模块 · 动手验证</p><h1>用特征函数代数化线性算子</h1><p>先寻找线性算子的特征函数，使复杂运算退化为乘以特征值。对常系数微分算子，e^{st} 把每次求导变成乘 s，微分方程因此变为特征多项式。解完代数问题后再按实根、共轭复根和重根重建时域解。</p></section><section class="panel"><h2>可操作实验</h2><div id="experiment" data-kind="eigenfunction"></div></section><section class="panel"><h2>观察任务</h2><ol><li>先改变控制量，观察图形和数值是否同步。</li><li>对照核心公式：<code>D e^{st}=s e^{st}；P(D)e^{st}=P(s)e^{st}</code></li><li>记录一个成立条件和一个失败边界。</li></ol></section></main><script>window.MODULE={"id": "07", "title": "用特征函数代数化线性算子", "formula": "D e^{st}=s e^{st}；P(D)e^{st}=P(s)e^{st}"}</script><script src="../assets/app.js"></script></body></html>
